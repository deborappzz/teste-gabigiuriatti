    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap');

        /* Configuração de Cores Gastronômicas */
        :root {
            --wine-red: #722F37; /* Cor de Vinho/Marsala */
            --warm-wheat: #F5E6D3; /* Cor de Trigo/Massa crua */
            --sage-green: #8A9A5B; /* Verde Sálvia (detalhe) */
            --dark-charcoal: #2D2D2D;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--warm-wheat);
        }
        
        h1, h2, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Estilo dos Banners de Imagem */
        .banner-card {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .banner-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        .banner-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 100%);
            transition: background 0.4s ease;
        }

        .banner-card:hover .banner-overlay {
            background: linear-gradient(to top, rgba(114, 47, 55, 0.85) 0%, rgba(114, 47, 55, 0.3) 100%); /* Overlay vinho no hover */
        }

        .banner-img {
            transition: transform 0.6s ease;
        }

        .banner-card:hover .banner-img {
            transform: scale(1.05);
        }

        /* Estilo Botões Secundários (Vinho Sólido) */
        .solid-btn {
            background-color: var(--wine-red);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(114, 47, 55, 0.2);
            transition: all 0.3s ease;
        }

        .solid-btn:hover {
            background-color: #5a242b; /* Vinho mais escuro */
            transform: translateY(-2px);
        }

        /* Animações */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fundo com textura sutil */
        .bg-texture {
            background-image: radial-gradient(#d4c5b0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
